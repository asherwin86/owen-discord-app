<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>LanChat Host</title>
<style>
  body { margin: 0; padding: 24px; background: #1e1f22; color: #dbdee1; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: #949ba4; }
  .card { background: #2b2d31; border-radius: 8px; padding: 16px; margin-top: 16px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; color: #949ba4; letter-spacing: .04em; }
  .url { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .url code { flex: 1; background: #1e1f22; padding: 8px 10px; border-radius: 4px; font-size: 15px; user-select: all; }
  button { background: #5865f2; color: #fff; border: 0; border-radius: 4px; padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #4752c4; } button.grey { background: #404249; } button.grey:hover { background: #4e5058; }
  .status { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #23a559; margin-right: 6px; }
  label.opt { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  small { color: #949ba4; }
</style>
</head>
<body>
  <h1>LanChat Host</h1>
  <div class="sub"><span class="status"></span><span id="state">Server running</span> &middot; v<span id="ver"></span></div>

  <div class="card">
    <h2>Open this on any device on your network</h2>
    <div id="urls"></div>
    <div class="row" style="margin-top:10px">
      <small>If other devices can't connect, allow LanChat Host through Windows Firewall (Private networks).</small>
      <button id="open" class="grey">Open here</button>
    </div>
  </div>

  <div class="card">
    <h2>Activity</h2>
    <div><span id="users">0</span> registered users &middot; <span id="online">0</span> online</div>
    <small id="data"></small>
    <label class="opt"><input type="checkbox" id="auto"> Start with Windows (runs hidden in the tray)</label>
  </div>

  <div class="card">
    <h2>Updates</h2>
    <div class="row">
      <span id="upd">...</span>
      <span><button id="check" class="grey">Check now</button> <button id="install" style="display:none">Restart &amp; update</button></span>
    </div>
  </div>

  <p class="sub">Closing this window keeps the server running in the system tray.</p>

<script>
  const $ = (id) => document.getElementById(id);
  let info = null;

  function renderUpdate(u) {
    $('upd').textContent = u.message || 'No update check yet.';
    $('install').style.display = u.status === 'ready' ? '' : 'none';
    $('check').disabled = u.status === 'checking' || u.status === 'downloading' || u.status === 'dev';
  }

  async function load() {
    info = await window.host.info();
    $('ver').textContent = info.version;
    $('data').textContent = 'Data: ' + info.dataDir;
    $('auto').checked = info.autoLaunch;
    $('users').textContent = info.stats.users;
    $('online').textContent = info.stats.online;
    const urls = $('urls');
    urls.replaceChildren();
    const list = info.urls.length ? info.urls : [info.local];
    for (const u of list) {
      const row = document.createElement('div'); row.className = 'url';
      const code = document.createElement('code'); code.textContent = u;
      const btn = document.createElement('button'); btn.textContent = 'Copy'; btn.className = 'grey';
      btn.onclick = async () => { await window.host.copy(u); btn.textContent = 'Copied'; setTimeout(() => (btn.textContent = 'Copy'), 1200); };
      row.append(code, btn); urls.append(row);
    }
    renderUpdate(info.update);
  }

  $('open').onclick = () => window.host.open(info.local);
  $('auto').onchange = (e) => window.host.setAutoLaunch(e.target.checked);
  $('check').onclick = () => window.host.checkUpdate();
  $('install').onclick = () => window.host.installUpdate();
  window.host.onUpdate(renderUpdate);
  load();
  setInterval(load, 5000);
</script>
</body>
</html>
